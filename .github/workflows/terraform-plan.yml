name: Terraform Plan

on:
  pull_request:
    branches:
      - dev
      - test
      - uat
      - master

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    # 🌿 GitHub Environment based on PR target branch
    environment:
      name: ${{ github.base_ref == 'dev' && 'dev' || github.base_ref == 'test' && 'test' || github.base_ref == 'uat' && 'uat' || github.base_ref == 'master' && 'prod' || github.base_ref == 'main' && 'prod' || 'dev' }}

    env:
      TF_PLAN_BUCKET: github-actions-demo-artifacts
      TF_STATE_BUCKET: cognine-terraform-states
      TF_AWS_REGION: ${{ vars.AWS_REGION }}
      TF_PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      TF_ENVIRONMENT: ${{ vars.ENVIRONMENT }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # 🌿 Set ENV variable
      - name: Set ENV
        run: |
          BRANCH=${{ github.base_ref }}

          if [ "$BRANCH" = "dev" ]; then
            echo "ENV=dev" >> $GITHUB_ENV
          elif [ "$BRANCH" = "test" ]; then
            echo "ENV=test" >> $GITHUB_ENV
          elif [ "$BRANCH" = "uat" ]; then
            echo "ENV=uat" >> $GITHUB_ENV
          elif [ "$BRANCH" = "master" ]; then
            echo "ENV=prod" >> $GITHUB_ENV
          else
            echo "Unknown branch"; exit 1
          fi

      # 🔧 Terraform Init with S3 backend
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=github-actions-demo/$ENV/terraform.tfstate"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="aws_region=${TF_AWS_REGION:-ap-south-1}" \
            -var="environment=${TF_ENVIRONMENT:-$ENV}" \
            -var="project_name=${TF_PROJECT_NAME:-github-actions-demo}" \
            -out=tfplan

      # ☁️ Upload plan to S3
      - name: Upload Plan to S3
        run: |
          aws s3 cp tfplan s3://${TF_PLAN_BUCKET}/$ENV/${{ github.event.pull_request.number }}.tfplan

      - name: Show Plan Output
        run: terraform show tfplan
